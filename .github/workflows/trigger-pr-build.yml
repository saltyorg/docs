name: Trigger PR Build

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Checkout docs automation consumer
        uses: actions/checkout@v6
        with:
          repository: saltyorg/docs-automation
          path: docs-automation

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: docs-automation/go.mod
          cache-dependency-path: docs-automation/go.sum

      - name: Build docs automation consumer
        working-directory: docs-automation
        run: go build -o "$RUNNER_TEMP/sb-docs" .

      - name: Test inventory template consumer behavior
        run: python3 .github/scripts/test_inventory_template.py --sb-docs "$RUNNER_TEMP/sb-docs"

      - name: Restore MkDocs build cache
        id: cache-docs-restore
        uses: actions/cache/restore@v5
        with:
          key: docs-${{ github.event.pull_request.number }}
          path: .cache
          restore-keys: |
            docs-${{ github.event.pull_request.number }}

      - name: Install system dependencies
        run: sudo apt-get install pngquant

      - name: Install requirements.txt
        run: |
          pip install wheel
          pip install -r requirements.txt

      - name: Build mkdocs
        run: |
          mkdocs build --clean
          mkdocs --version
        env:
          CI: true

      - name: Save MkDocs build cache
        id: cache-docs-save
        uses: actions/cache/save@v5
        with:
          path: .cache
          key: docs-${{ github.event.pull_request.number }}-${{ github.run_id }}

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: pr_build_artifacts
          path: site/
          retention-days: 1
