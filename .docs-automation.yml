# =============================================================================
# Docs Automation Configuration
# =============================================================================
# This file should be placed at the root of the docs repository as:
#   .docs-automation.yml
#
# The sb-docs binary will read this configuration to know where to find
# the various repositories and how to process documentation.
# =============================================================================

# =============================================================================
# Repository Paths
# =============================================================================
# These paths are relative to the workflow working directory.
# In a typical GitHub Actions setup:
#   - docs repo is checked out to ./docs
#   - saltbox repo is checked out to ./saltbox
#   - sandbox repo is checked out to ./sandbox

repositories:
  saltbox: "saltbox"
  sandbox: "sandbox"
  docs: "docs"

# =============================================================================
# Blacklist Configuration
# =============================================================================
# Roles to exclude from documentation coverage checks
# (these roles intentionally don't have dedicated documentation)

blacklist:
  docs_coverage:
    saltbox:
      - "authentik_worker"
      - "cloudflare"
      - "cloudplow_disable"
      - "hetzner"
      - "index"
      - "notify"
      - "nvidia"
      - "plex_extra_tasks"
      - "pre_tasks"
      - "sanity_check"
      - "scripts"
      - "user_check"
    sandbox:
      - "homarr_legacy"
      - "koito_migrate"
      - "n8n_runner"  # internal helper documented by n8n
      - "sanity_check"
      - "sure_worker"  # internal helper documented by sure
      # Deprecated roles
      - "booklore"  # deprecated
      - "unifi"  # deprecated
      - "hoarder"  # deprecated
      - "plex_meta_manager"  # deprecated

# =============================================================================
# Documentation Health Policy
# =============================================================================
# Check paths are docs-root-relative exact paths. Keep these lists empty unless
# a page needs a deliberate, check-specific exemption.

checks:
  coverage:
    enabled: true
    exclude_paths: []
  frontmatter:
    enabled: true
    exclude_paths: []
  editorial:
    enabled: true
    exclude_paths: []
    statuses:
      - draft2
      - outdated

# Source repositories used for source links and provenance in docs-health issues.
issue:
  source_repositories:
    saltbox:
      slug: saltyorg/Saltbox
      ref: master
    sandbox:
      slug: saltyorg/Sandbox
      ref: master

# =============================================================================
# Path Overrides
# =============================================================================
# Override default documentation paths for specific roles.
# Format: repo_type -> role_name -> custom_path (relative to docs root)
#
# Use this when a role's documentation doesn't follow the standard naming:
#   saltbox role "foo" -> docs/apps/foo.md
#   sandbox role "bar" -> docs/sandbox/apps/bar.md

path_overrides:
  saltbox:
    arr_db: "docs/reference/modules/arr_db.md"
    backup2: "docs/reference/modules/backup2.md"
    backup: "docs/reference/modules/backup.md"
    common: "docs/reference/modules/common.md"
    custom: "docs/reference/modules/custom.md"
    diag: "docs/reference/modules/diag.md"
    download_clients: "docs/reference/modules/download_clients.md"
    download_indexers: "docs/reference/modules/download_indexers.md"
    hetzner_nfs: "docs/reference/modules/hetzner_nfs.md"
    hetzner_vlan: "docs/reference/modules/hetzner_vlan.md"
    kernel: "docs/reference/modules/kernel.md"
    main_tags: "docs/reference/modules/main_tags.md"
    media_server: "docs/reference/modules/media_server.md"
    motd: "docs/reference/modules/motd.md"
    mount_templates: "docs/reference/modules/mount_templates.md"
    permissions: "docs/reference/modules/permissions.md"
    plex_auth_token: "docs/reference/modules/plex_auth_token.md"
    plex_db: "docs/reference/modules/plex_db.md"
    plex_fix_futures: "docs/reference/modules/plex_fix_futures.md"
    reboot: "docs/reference/modules/reboot.md"
    remote: "docs/reference/modules/remote.md"
    restore: "docs/reference/modules/restore.md"
    saltbox_mod: "docs/reference/modules/saltbox_mod.md"
    sandbox: "docs/reference/modules/sandbox.md"
    shell: "docs/reference/modules/shell.md"
    system: "docs/reference/modules/system.md"
    traefik_file_template: "docs/reference/modules/traefik_file_template.md"
    traefik_template: "docs/reference/modules/traefik_template.md"
    unionfs: "docs/reference/modules/unionfs.md"
    user: "docs/reference/modules/user.md"
  sandbox:
    main_tag: "docs/reference/modules/main_tag.md"

# =============================================================================
# Global Override Options
# =============================================================================
# Variables with these suffixes are handled globally and not documented per-role.
# The 'variables' section defines documentation for global override variables.

global_overrides:
  ignore_suffixes:
    - "_dns_proxy"
    - "_docker_network_mode"
    - "_docker_networks_alias"
    - "_docker_stop_timeout"
    - "_paths_folders_list"
    - "_traefik_api_enabled"
    - "_traefik_enabled"
    - "_traefik_entrypoint_web"
    - "_traefik_entrypoint_websecure"
    - "_traefik_middleware_custom"
    - "_traefik_middleware_default"
    - "_traefik_sso_middleware"
    - "_web_domain"
    - "_web_subdomain"
    - "_web_port"
  variables:
    _autoheal_enabled:
      description: "Enable or disable Autoheal monitoring for containers created when deploying"
      default: "true"
      type: "bool"

    _depends_on:
      description: "List of container dependencies that must be running before containers start"
      default: ""
      type: "string"

    _depends_on_delay:
      description: "Delay in seconds before starting containers after dependencies are ready"
      default: "0"
      type: "string (number)"

    _depends_on_healthchecks:
      description: "Enable healthcheck waiting for container dependencies"
      default: null
      type: "string (true/false)"

    _diun_enabled:
      description: "Enable or disable Diun update notifications for containers created when deploying"
      default: "true"
      type: "bool"

    _dns_enabled:
      description: "Enable or disable automatic DNS record creation for containers"
      default: "true"
      type: "bool"

    _docker_controller:
      description: "Enable or disable Saltbox Docker Controller management for containers"
      default: "true"
      type: "bool"

    _themepark_addons:
      description: "ThemePark addon names to enable"
      default: null
      type: "list"

    _paths_folders_list_custom:
      description: "Extra directories to create"
      default: null
      type: "list"

    _paths_group:
      description: "Group for directories created by the role"
      default: null
      type: "string"

    _paths_owner:
      description: "Owner for directories created by the role"
      default: null
      type: "string"

    _paths_permissions:
      description: "Permissions for directories created by the role"
      default: null
      type: "string"

    _paths_recursive:
      description: "Apply ownership and permissions recursively"
      default: null
      type: "bool"

    _traefik_autodetect_enabled:
      description: "Enable Traefik autodetect middleware for containers"
      default: "false"
      type: "bool"

    _traefik_crowdsec_enabled:
      description: "Enable CrowdSec middleware for containers"
      default: "false"
      type: "bool"

    _traefik_error_pages_enabled:
      description: "Enable custom error pages middleware for containers"
      default: "false"
      type: "bool"

    _traefik_gzip_enabled:
      description: "Enable gzip compression middleware for containers"
      default: "false"
      type: "bool"

    _traefik_robot_enabled:
      description: "Enable robots.txt middleware for containers"
      default: "true"
      type: "bool"

    _traefik_tailscale_enabled:
      description: "Enable Tailscale-specific Traefik configuration for containers"
      default: "false"
      type: "bool"

    _traefik_wildcard_enabled:
      description: "Enable wildcard certificate for containers"
      default: "true"
      type: "bool"

    _web_fqdn_override:
      description: "Override the Traefik fully qualified domain name (FQDN) for containers"
      default: null
      type: "list"
      example: |
        ```yaml
        {variable}:
          - "{{ traefik_host }}"
          - "{role}2.{{ user.domain }}"
          - "{role}.otherdomain.tld"
        ```

        Note: Include `{{ traefik_host }}` to preserve the default FQDN alongside your custom entries

    _web_host_override:
      description: "Override the Traefik web host configuration for containers"
      default: null
      type: "string"
      example: |
        ```yaml
        {variable}: "Host(`{{ traefik_host }}`) || Host(`{{ '{role}2.' + user.domain }}`)"
        ```

        Note: Use `{{ traefik_host }}` to include the default host configuration in your custom rule

    _web_scheme:
      description: "URL scheme to use for web access to containers"
      default: null
      type: "string (http/https)"

# =============================================================================
# Docker+ Overrides
# =============================================================================

docker_overrides:
  ignore_suffixes: []
  groups:
    - name: "GPU"
      primary: "_docker_gpu_enabled"
      companions:
        - "_docker_nvidia_disabled"
        - "_docker_dev_dri_disabled"
  variables:
    _docker_cpus:
      description: "CPU allocation accepted as a numeric string, such as 1.5"
      type: "string (number)"

    _docker_healthy_wait_timeout:
      description: "Healthy-state wait timeout in seconds"
      type: "int"

    _docker_gpu_enabled:
      description: |-
        Set this to true to let the app use a GPU.
        Intel access also requires gpu.intel: true.
        NVIDIA access also requires nvidia_enabled: true.
        This setting does not install or enable GPU support on the server.
      default: "false"
      type: "bool"

    _docker_nvidia_disabled:
      description: |-
        Set this to true to turn off automatic NVIDIA access for this app.
        It only has an effect when the app's _docker_gpu_enabled option and
        nvidia_enabled are both true.
        Automatic /dev/dri access may remain.
      default: "false"
      type: "bool"

    _docker_dev_dri_disabled:
      description: |-
        Set this to true to stop Saltbox from automatically sharing the
        server's /dev/dri video devices with this app.
        It only has an effect when the app's _docker_gpu_enabled option is true
        and either gpu.intel or nvidia_enabled is true.
        NVIDIA-specific access may remain.
      default: "false"
      type: "bool"

# =============================================================================
# Docker Image Metadata
# =============================================================================

docker_metadata:
  icon: material/docker
  release_link:
    name: Image tags
  overrides:
    ghcr.io/imagegenius/immich:
      url: https://github.com/imagegenius/docker-immich/pkgs/container/immich
      type: github
  rules:
    - pattern: '^ghcr\.io/([^/]+)/([^/]+)$'
      url: https://github.com/$1/$2/pkgs/container/$2
      type: github
    - pattern: '^lscr\.io/linuxserver/([^/]+)$'
      url: https://hub.docker.com/r/linuxserver/$1/tags
      type: docker
    - pattern: '^public\.ecr\.aws/([^/]+)/([^/]+)$'
      url: https://gallery.ecr.aws/$1/$2
      type: docker
    - pattern: '^codeberg\.org/([^/]+)/([^/]+)$'
      url: https://codeberg.org/$1/-/packages/container/$2/versions
      type: docker
    - pattern: '^docker\.io/library/([^/]+)$'
      url: https://hub.docker.com/_/$1/tags
      type: docker
    - pattern: '^docker\.io/([^/]+)/([^/]+)$'
      url: https://hub.docker.com/r/$1/$2/tags
      type: docker
    - pattern: '^([^/]+)/([^/]+)$'
      url: https://hub.docker.com/r/$1/$2/tags
      type: docker
    - pattern: '^([^/]+)$'
      url: https://hub.docker.com/_/$1/tags
      type: docker
  ignore:
    - gcr.io/cadvisor/cadvisor
    - docker.n8n.io/n8nio/n8n
    - docker.io/ajslater/codex
    - docker.elastic.co/elasticsearch/elasticsearch

# =============================================================================
# Section Explainers
# =============================================================================
# Reusable introductory text for matching role-default sections.

section_explainers:
  Ports: |-
    When no saved assignment exists, the role allocates the first available port within the inclusive low and high bounds and retains it for future runs.
    Override an instance's bounds to control new allocation; set both bounds to the same value to require one exact port.

    Existing assignments are stored in `/opt/saltbox/port-assignments.json`. A conflict-free saved port remains authoritative even outside the current bounds, including a port manually changed in that file.
    If a saved assignment conflicts, another available port is selected from the current bounds and a warning shows the old port, new port, and conflict source.

# =============================================================================
# Type Inference Rules
# =============================================================================
# Rules for inferring variable types from their names.

type_inference:
  exact:
    "_depends_on_healthchecks": "string (true/false)"
    "_depends_on_delay": "string (number)"
    "_depends_on": "string"
  patterns:
    - suffix_contains: "_scheme"
      type: "string (http/https)"
    - suffix_contains: "_enabled"
      type: "bool (true/false)"
    - suffix_contains: "_proxy"
      type: "bool (true/false)"
    - suffix_contains: "_domain"
      type: "string"
    - suffix_contains: "_subdomain"
      type: "string"
    - suffix_contains: "_url"
      type: "string"
    - suffix_contains: "_port"
      type: "string (number)"
    - suffix_contains: "_timeout"
      type: "string (number)"
  overrides:
    "_dns_proxy": "bool"
    "_dns_record": "string"
    "_dns_zone": "string"
    "elasticsearch_role_docker_user": "string"
  filters:
    "saltbox_argv": "list"
    "traefik_certificate_domains": "list"
    "traefik_certificate_labels": "dict"
    "traefik_certificate_plan": "dict"
  symbols:
    "backup_cleanup_custom_rclone_flags": "string"
    "backup_cleanup_enabled": "bool"
    "backup_cleanup_number": "int"
    "saltbox_auto_reboot": "bool"
    "traefik_http": "bool"

