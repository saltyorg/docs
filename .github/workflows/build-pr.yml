name: Build PR & Deploy
run-name: "PR #${{ github.event.workflow_run.pull_requests[0].number }} - ${{ github.event.workflow_run.display_title }}"

on:
  workflow_run:
    workflows: ["Trigger PR Build"]
    types:
      - completed

concurrency:
  group: pull-request-builds
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  preview:
    if: contains(fromJSON('["success", "failure", "timed_out", "startup_failure", "cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted reporting code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve triggering PR context
        id: context
        run: python .github/scripts/pr_preview.py resolve

      - name: Download built site
        if: github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: pr_build_artifacts
          path: ${{ github.workspace }}/pr_bundle

      - name: Resolve built site path
        if: github.event.workflow_run.conclusion == 'success'
        id: site
        env:
          ARTIFACT_PATH: ${{ github.workspace }}/pr_bundle
        run: python .github/scripts/pr_preview.py site-path

      - name: Publish to Cloudflare Pages
        if: github.event.workflow_run.conclusion == 'success'
        id: cloudflare
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >
            pages deploy ${{ steps.site.outputs.site-path }}
            --project-name=docs
            --branch=pr-${{ steps.context.outputs.pr-number }}
            --commit-hash=${{ steps.context.outputs.pr-sha }}
            --commit-dirty=true

      - name: Report PR preview result
        if: always() && steps.context.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.cloudflare.outcome }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          BRANCH_URL: ${{ steps.cloudflare.outputs.pages-deployment-alias-url }}
        run: python .github/scripts/pr_preview.py report
