name: CI - Workflow Result

on:
  pull_request:
    paths:
      - '.github/scripts/pr_preview.py'
      - '.github/scripts/test_pr_preview.py'
      - '.github/scripts/commit_generated.cjs'
      - '.github/scripts/test_commit_generated.cjs'
      - '.github/workflows/automation.yml'
      - '.github/workflows/build-pr.yml'
      - '.github/workflows/notify.yml'
      - '.github/workflows/trigger-pr-build.yml'
      - '.github/workflows/workflow-result-ci.yml'
      - '.github/renovate.json'
  push:
    branches:
      - main
    paths:
      - '.github/scripts/pr_preview.py'
      - '.github/scripts/test_pr_preview.py'
      - '.github/scripts/commit_generated.cjs'
      - '.github/scripts/test_commit_generated.cjs'
      - '.github/workflows/automation.yml'
      - '.github/workflows/build-pr.yml'
      - '.github/workflows/notify.yml'
      - '.github/workflows/trigger-pr-build.yml'
      - '.github/workflows/workflow-result-ci.yml'
      - '.github/renovate.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Test PR preview reporting
        run: python3 .github/scripts/test_pr_preview.py -v

      - name: Test signed documentation commits against the GitHub schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITHUB_COMMITTABLE_BRANCH_FIELDS=$(gh api graphql \
            -f query='query { __type(name: "CommittableBranch") { inputFields { name } } }' \
            --jq '[.data.__type.inputFields[].name]')
          export GITHUB_COMMITTABLE_BRANCH_FIELDS
          node --test .github/scripts/test_commit_generated.cjs

      - name: Compile PR preview reporting
        run: python3 -m compileall -q .github/scripts/pr_preview.py

      - name: Validate result workflows
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.12 \
            .github/workflows/build-pr.yml \
            .github/workflows/notify.yml \
            .github/workflows/trigger-pr-build.yml \
            .github/workflows/workflow-result-ci.yml \
            .github/workflows/automation.yml

      - name: Check whitespace errors
        run: git diff --check
