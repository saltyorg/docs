name: Trigger PR Build

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event.repository.fork == false
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python 3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Checkout docs automation consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: saltyorg/docs-automation
          path: docs-automation
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: docs-automation/go.mod
          cache-dependency-path: docs-automation/go.sum

      - name: Build docs automation consumer
        working-directory: docs-automation
        run: go build -o "$RUNNER_TEMP/sb-docs" .

      - name: Test inventory template consumer behavior
        run: python3 .github/scripts/test_inventory_template.py --sb-docs "$RUNNER_TEMP/sb-docs"

      - name: Restore MkDocs build cache
        id: cache-docs-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: docs-${{ github.event.pull_request.number }}
          path: .cache
          restore-keys: |
            docs-${{ github.event.pull_request.number }}

      - name: Install system dependencies
        run: sudo apt-get install pngquant

      - name: Install requirements.txt
        run: |
          pip install wheel
          pip install -r requirements.txt

      - name: Build mkdocs
        run: |
          mkdocs build --clean
          mkdocs --version
        env:
          CI: true

      - name: Save MkDocs build cache
        id: cache-docs-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: docs-${{ github.event.pull_request.number }}-${{ github.run_id }}

      - name: Upload built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr_build_artifacts
          path: site/
          retention-days: 1
