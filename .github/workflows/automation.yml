name: Documentation Automation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/apps/**'
      - 'docs/sandbox/apps/**'
      - 'docs/reference/modules/**'
      - '.docs-automation.yml'
      - 'templates/**'

  schedule:
    # Run daily at 5:17 AM UTC as a recovery sweep
    - cron: '17 5 * * *'

  workflow_dispatch:

jobs:
  docs-automation:
    name: Documentation Automation
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'Generated with sb-docs') || (github.actor != 'saltbox-automation[bot]' && github.event.head_commit.author.name != 'github-actions[bot]'))
    concurrency:
      group: documentation-automation
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v7
        with:
          path: docs
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Saltbox repository
        uses: actions/checkout@v7
        with:
          repository: saltyorg/Saltbox
          path: saltbox
          fetch-depth: 1

      - name: Checkout Sandbox repository
        uses: actions/checkout@v7
        with:
          repository: saltyorg/Sandbox
          path: sandbox
          fetch-depth: 1

      - name: Install sb-docs
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: saltyorg/docs-automation
          tag: latest
          extension-matching: disable
          platform: linux
          arch: amd64
          rename-to: sb-docs
          chmod: "0755"

      - name: Install sb binary (for CLI help generation)
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: saltyorg/sb-go
          tag: latest
          extension-matching: disable
          platform: linux
          arch: amd64
          rename-to: sb
          chmod: "0755"

      - name: Verify installations
        run: |
          sb-docs version
          sb version

      - name: Update documentation and run checks
        run: |
          sb-docs update --config docs/.docs-automation.yml --check --manage-issue

      - name: Create documentation commit token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.SALTBOX_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.SALTBOX_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit signed documentation changes
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const commit = require('./docs/.github/scripts/commit_generated.cjs');
            await commit({ github, core, context });
